<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>update record</title>
</head>
<body>
    <h1>update {{ ticket.title }}</h1>
<form action="/update_ticket_action" method="POST">
    <input type="text" name="ticket_id" value="{{ ticket.id }}" readonly>
    <input type="text" name="title" value="{{ ticket.title }}" placeholder="Ticket Title">
  <textarea name="description">{{ ticket.description }}</textarea>
    <select name="status">
        <option value="Open">Open</option>
        <option value="Closed" >Closed</option>
    </select>
    <button type="submit">Update Ticket</button>
</form>
</body>
</html>
